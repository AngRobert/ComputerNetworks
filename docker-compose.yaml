services:
    server:
        build:
            context: ./tcp_hijacking/server/
        privileged: true
        volumes:
            - ./tcp_hijacking:/local
            - ./tcp_hijacking/policies.json:/usr/lib/firefox/distribution/policies.json
        tty: true
        cap_add:
          - NET_ADMIN
          - NET_RAW
          - SYS_ADMIN
        ports:
          - "5800:5800"
          - "5900:5900"
        networks:
            subnet2:
              ipv4_address: 198.10.0.2
        depends_on:
            - "router"
        sysctls:
          - net.ipv4.tcp_congestion_control=reno
        command: /bin/sh -c "/local/sh/server.sh && /init"
    middle:
        build:
            context: ./tcp_hijacking/
        volumes:
            - ./tcp_hijacking:/local
        tty: true
        cap_add:
          - NET_ADMIN
          - NET_RAW
          - SYS_ADMIN
        networks:
            subnet2:
              ipv4_address: 198.10.0.3
        depends_on:
            - "router"
        sysctls:
          - net.ipv4.ip_forward=1
          - net.ipv4.tcp_congestion_control=reno
        command: bash -c "/local/sh/middle.sh && python3 local/poison.py"
    router:
        build:
            context: ./tcp_hijacking/
        volumes:
            - ./tcp_hijacking:/local
        tty: true
        cap_add:
          - NET_ADMIN
          - NET_RAW
          - SYS_ADMIN
        networks:
            subnet1:
              ipv4_address: 172.10.0.1
            subnet2:
              ipv4_address: 198.10.0.1
        sysctls:
          - net.ipv4.ip_forward=1
          - net.ipv4.tcp_congestion_control=reno
        command: bash -c "/local/sh/router.sh && sleep infinity"
    client:
        build:
            context: ./tcp_hijacking/
        volumes:
            - ./tcp_hijacking:/local
        tty: true
        cap_add:
          - NET_ADMIN
          - NET_RAW
          - SYS_ADMIN
        networks:
            subnet1:
              ipv4_address: 172.10.0.2
        depends_on:
            - "router"
            - "server"
        sysctls:
          - net.ipv4.tcp_congestion_control=reno
        command: bash -c "/local/sh/client.sh && sleep infinity"
    dashboard:
      build: 
        context: "./home_website/"
      ports:
        - "3000:3000"
      networks:
        subnet1:
          ipv4_address: 172.10.0.10

    mxmap:
      build: 
        context: "./mxmap/"
      ports:
        - "5000:5000"
      networks:
        subnet1:
          ipv4_address: 172.10.0.20

    dnstunnel_server:
      build: 
        context: "./dnstunnel/server/"
      ports:
        - "5002:5002/udp"
      volumes:
        - ./dnstunnel/files:/app/files
        - ./dnstunnel/downloads:/app/downloads
      networks:
        subnet1:
          ipv4_address: 172.10.0.30

    dnstunnel_flask:
      build: 
        context: "./dnstunnel/flask/"
      ports:
        - "5001:5001"
      volumes:
        - ./dnstunnel/files:/app/files
        - ./dnstunnel/downloads:/app/downloads
      networks:
        subnet1:
          ipv4_address: 172.10.0.40


    dns_adblocker_udp:
      build:
        context: "AdBlockerDns/" 
      ports:
        - "53:53/udp"
      networks:
        subnet_Dns:
          ipv4_address: 67.67.0.10 #adresa serviciului (containerului)

    doh_endpoint:
      build:
        context: "AdBlockerDns/DohEndpoint/"
      ports:
        - "8000:5001" #portul fastapi la 5001
      networks:
        subnet_Dns:
          ipv4_address: 67.67.0.11 
          
    
networks:
    subnet1:
        driver_opts:
          com.docker.network.driver.mtu: 1500
        ipam:
          driver: default
          config:
              - subnet: 172.10.0.0/16
                gateway: 172.10.1.1
    subnet2:
        driver_opts:
          com.docker.network.driver.mtu: 1500
        ipam:
          driver: default
          config:
              - subnet: 198.10.0.0/16
                gateway: 198.10.1.1
    
    subnet_Dns:
      ipam: #ip addres management, ne controleaza cum sunt folosite adresele ip ale retelei
        driver: default #pt ca da
        config:
          - subnet: 67.67.0.0/16 # lmao 67
            gateway: 67.67.1.1

