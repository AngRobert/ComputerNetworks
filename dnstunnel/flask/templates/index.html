<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
        <title>DNS Tunnel</title>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap');
            * {
                font-family: "Ubuntu", sans-serif;
                font-weight: 400;
                font-style: normal;
            }
            body {
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                overflow-x: hidden;
                background-color: #0d1117;
            }
            .sidebar {
                background-color: #161b22;
                border-right: 1px solid #30363d;
                min-height: 100vh;
            }
            .folder-icon { margin-right: 6px; }
            .file-icon { color: #8b949e; margin-right: 6px; }
            .file-item { color: #c9d1d9; font-size: 0.9rem; margin-bottom: 4px; display: flex; align-items: center; text-decoration: none; }
            
            .clickable-file { padding: 4px 6px; border-radius: 4px; transition: background-color 0.2s; cursor: pointer; }
            .clickable-file:hover { background-color: #30363d; text-decoration: none; color: #58a6ff; }
            .clickable-file:hover .file-icon { color: #58a6ff; }
            
            .folder-title { font-weight: 600; font-size: 1.1rem; color: #c9d1d9; margin-bottom: 10px; display: flex; align-items: center; }
            
            #fileContentArea { background-color: #0d1117; border: 1px solid #30363d; color: #c9d1d9; font-family: monospace; font-size: 0.85rem; height: 350px; overflow-y: auto; padding: 15px; border-radius: 6px; white-space: pre-wrap; }
        </style>
    </head>
    <body>
        <div class="row g-0 flex-grow-1">
            
            <div class="col-md-4 col-lg-3 p-4 sidebar">
                <h4 class="mb-4 text-light">DNS Tunnel</h4>
                <h6 class="mb-3 text-secondary">Download files through DNS</h6>

                <div class="folder-title mt-4">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="folder-icon" viewBox="0 0 16 16"><path d="M9.828 3h3.982a2 2 0 0 1 1.992 2.181l-.637 7A2 2 0 0 1 13.174 14H2.825a2 2 0 0 1-1.991-1.819l-.637-7a2 2 0 0 1 .342-1.31L.5 3a2 2 0 0 1 2-2h3.672a2 2 0 0 1 1.414.586l.828.828A2 2 0 0 0 9.828 3m-8.322.12q.322-.119.684-.12h5.396l-.707-.707A1 1 0 0 0 6.172 2H2.5a1 1 0 0 0-1 .981z"/></svg>
                    files (Server)
                </div>
                <div class="ps-3 mb-4">
                    {% for file in files %}
                        <div class="file-item">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="file-icon" viewBox="0 0 16 16"><path d="M4 0h5.293A1 1 0 0 1 10 .293L13.707 4a1 1 0 0 1 .293.707V14a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2m5.5 1.5v2a1 1 0 0 0 1 1h2z"/></svg>
                            {{ file }}
                        </div>
                    {% else %}
                        <div class="text-muted small">No files found.</div>
                    {% endfor %}
                </div>

                <div class="folder-title">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="folder-icon" viewBox="0 0 16 16"><path d="M9.828 3h3.982a2 2 0 0 1 1.992 2.181l-.637 7A2 2 0 0 1 13.174 14H2.825a2 2 0 0 1-1.991-1.819l-.637-7a2 2 0 0 1 .342-1.31L.5 3a2 2 0 0 1 2-2h3.672a2 2 0 0 1 1.414.586l.828.828A2 2 0 0 0 9.828 3m-8.322.12q.322-.119.684-.12h5.396l-.707-.707A1 1 0 0 0 6.172 2H2.5a1 1 0 0 0-1 .981z"/></svg>
                    downloads (Local)
                </div>
                <div class="ps-3">
                    {% for download in downloads %}
                        <a href="#" class="file-item clickable-file" onclick="viewFileContent('{{ download }}'); return false;">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="file-icon" viewBox="0 0 16 16"><path d="M4 0h5.293A1 1 0 0 1 10 .293L13.707 4a1 1 0 0 1 .293.707V14a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2m5.5 1.5v2a1 1 0 0 0 1 1h2z"/></svg>
                            {{ download }}
                        </a>
                    {% else %}
                        <div class="text-muted small">No downloads found.</div>
                    {% endfor %}
                </div>
            </div>

            <div class="col-md-8 col-lg-9 d-flex flex-column align-items-center justify-content-center p-4">
                <div class="card bg-dark border-secondary shadow-lg" style="max-width: 500px; width: 100%; border-radius: 12px;">
                    <div class="card-body p-5">
                        <h3 class="card-title text-center mb-4 fw-bold">DNS Download</h3>
                        <form id="downloadForm">
                            <div class="mb-4">
                                <label for="filenameInput" class="form-label text-secondary">File name (must exist on server)</label>
                                <input type="text" class="form-control bg-dark text-light border-secondary" id="filenameInput" placeholder="ex: secret.txt" required autocomplete="off">
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary py-2 fw-bold" id="downloadBtn">
                                    <span class="spinner-border spinner-border-sm d-none me-2" id="btnSpinner" role="status" aria-hidden="true"></span>
                                    <span id="btnText">Download from Server</span>
                                </button>
                            </div>
                        </form>
                        <div id="statusMessage" class="mt-3 text-center small" style="min-height: 20px;"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="modal fade" id="fileViewModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content bg-dark border-secondary">
            <div class="modal-header border-secondary">
                <h5 class="modal-title" id="modalFileName">Loading...</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-0">
                <div id="fileContentArea" class="m-3">Loading content...</div>
            </div>
            <div class="modal-footer border-secondary">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
            </div>
        </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

        <script>
            document.getElementById('downloadForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const filename = document.getElementById('filenameInput').value.trim();
                const btn = document.getElementById('downloadBtn');
                const spinner = document.getElementById('btnSpinner');
                const btnText = document.getElementById('btnText');
                const statusMsg = document.getElementById('statusMessage');
                
                btn.disabled = true;
                spinner.classList.remove('d-none');
                btnText.textContent = 'Transferring through DNS...';
                
                statusMsg.textContent = 'Downloading file. Please wait (it may take a while)...';
                statusMsg.className = 'mt-3 text-center small text-info';

                const source = new EventSource('/api/download/' + encodeURIComponent(filename));

                source.onmessage = function(event) {
                    if (event.data === "DONE") {
                        source.close(); 
                        statusMsg.textContent = "Download complete! Refreshing file list...";
                        setTimeout(() => window.location.reload(), 1500);
                    } else {
                        statusMsg.textContent = event.data; 
                    }
                };

                source.addEventListener('error', function(event) {
                    statusMsg.textContent = 'An error occurred during the download: ' + event.data;
                    statusMsg.className = 'mt-3 text-center small text-danger';
                    
                    btn.disabled = false;
                    spinner.classList.add('d-none');
                    btnText.textContent = 'Download from Server';

                    source.close();
                });
            });

            const fileModal = new bootstrap.Modal(document.getElementById('fileViewModal'));

            async function viewFileContent(filename) {
                document.getElementById('modalFileName').textContent = filename;
                const contentArea = document.getElementById('fileContentArea');
                contentArea.textContent = 'Loading content...';
                contentArea.style.color = '#8b949e';

                fileModal.show();

                try {
                    const response = await fetch('/api/view/' + encodeURIComponent(filename));
                    
                    if (!response.ok) {
                        throw new Error(`Could not read file (Error ${response.status}). Maybe it's not a text file?`);
                    }

                    const text = await response.text();
                    contentArea.textContent = text;
                    contentArea.style.color = '#c9d1d9'; 

                } catch (error) {
                    contentArea.textContent = 'Error: ' + error.message;
                    contentArea.style.color = '#f85149';
                }
            }
        </script>
    </body>
</html>
