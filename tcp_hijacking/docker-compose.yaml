services:
    server:
        build:
            context: ./server
        privileged: true
        volumes:
            - .:/local
            - ./policies.json:/usr/lib/firefox/distribution/policies.json
        tty: true
        cap_add:
          - NET_ADMIN
          - NET_RAW
          - SYS_ADMIN
        ports:
          - "5800:5800"
          - "5900:5900"
        networks:
            subnet2:
              ipv4_address: 198.10.0.2
        depends_on:
            - "router"
        sysctls:
          - net.ipv4.tcp_congestion_control=reno
        command: /bin/sh -c "/local/sh/server.sh && /init"
    middle:
        build:
            context: .
        volumes:
            - .:/local
        tty: true
        cap_add:
          - NET_ADMIN
          - NET_RAW
          - SYS_ADMIN
        networks:
            subnet2:
              ipv4_address: 198.10.0.3
        depends_on:
            - "router"
        sysctls:
          - net.ipv4.ip_forward=1
          - net.ipv4.tcp_congestion_control=reno
        command: bash -c "/local/sh/middle.sh && python3 local/poison.py"
    router:
        build:
            context: .
        volumes:
            - .:/local
        tty: true
        cap_add:
          - NET_ADMIN
          - NET_RAW
          - SYS_ADMIN
        networks:
            subnet1:
              ipv4_address: 172.10.0.1
            subnet2:
              ipv4_address: 198.10.0.1
        sysctls:
          - net.ipv4.ip_forward=1
          - net.ipv4.tcp_congestion_control=reno
        command: bash -c "/local/sh/router.sh && sleep infinity"
    client:
        build:
            context: .
        volumes:
            - .:/local
        tty: true
        cap_add:
          - NET_ADMIN
          - NET_RAW
          - SYS_ADMIN
        networks:
            subnet1:
              ipv4_address: 172.10.0.2
        depends_on:
            - "router"
            - "server"
        sysctls:
          - net.ipv4.tcp_congestion_control=reno
        command: bash -c "/local/sh/client.sh && sleep infinity"

networks:
    subnet1:
        driver_opts:
          com.docker.network.driver.mtu: 1500
        ipam:
          driver: default
          config:
              - subnet: 172.10.0.0/16
                gateway: 172.10.1.1
    subnet2:
        driver_opts:
          com.docker.network.driver.mtu: 1500
        ipam:
          driver: default
          config:
              - subnet: 198.10.0.0/16
                gateway: 198.10.1.1
